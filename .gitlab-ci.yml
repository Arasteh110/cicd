rollback:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client

    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      set -e

      DEPLOY_PATH="/home/testcicd/domains/cicdtest.salamsch.org"

      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
        set -e

        cd '$DEPLOY_PATH'

        CURRENT=\$(readlink current | sed 's#releases/##')

        echo 'Current release:'
        echo \"\$CURRENT\"

        PREVIOUS=\$(ls -1dt releases/* | grep -v \"\$CURRENT\" | head -1 | xargs -n1 basename)

        echo 'Rollback target:'
        echo \"\$PREVIOUS\"

        test -d \"releases/\$PREVIOUS\"

        ln -sfn \"releases/\$PREVIOUS\" current

        echo 'Rollback completed.'

        echo 'Current release after rollback:'
        readlink current
      "

  when: manual

  only:
    - main